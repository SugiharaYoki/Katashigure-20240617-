<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVP · 瞬发特效预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c14;color:#eaf2ff;font:14px system-ui}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 10px}p{color:#92a4bd;line-height:1.7}header{margin-bottom:22px}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.list{height:70vh;overflow:auto;display:grid;gap:5px;align-content:start}button{font:inherit;color:#a9bbd2;background:#111b2a;border:1px solid #263952;border-radius:6px;padding:10px;text-align:left;cursor:pointer}button.active{color:white;border-color:#70f5e6;background:#15343c}section{min-width:0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0}canvas{width:100%;aspect-ratio:16/10;background:#0b121d;border:1px solid #263952;border-radius:12px}strong{color:#b6ffef}.legend{display:flex;justify-content:space-between;gap:12px}input{accent-color:#78e6d5}small{color:#7890aa}@media(max-width:700px){.layout{grid-template-columns:1fr}.list{height:180px;grid-template-columns:repeat(3,1fr)}main{padding:16px}}
</style><main><header><h1>PVP · 短促爆发 / 战斗视野</h1><p>蓄势 → 破空 → 外扩 → 消散。选择礼装，切换第一人称观察近身避让。此页面依据生成坐标模拟动画，不是 Minecraft 画面；粒子贴图、遮挡、随机寿命与音效仍以游戏客户端为准。</p></header><div class="layout"><nav class="list"></nav><section><div class="legend"><strong id="name"></strong><span id="phase"></span></div><div class="controls"><button id="orbit" class="active">战场远景</button><button id="first">第一人称</button><button id="pause">暂停</button><label>移动 <input id="distance" type="range" min="0" max="12" step=".1" value="0"></label><small id="position">站在施法点</small></div><canvas width="1200" height="750"></canvas><p>释放发射器 12 tick 自动销毁；粒子分 6 次脉冲发出。近处 4 格内的细粒子不发送给该玩家，发光短轨迹避开 6 格。大型轨迹位于地面或高处，不生成环绕物品。</p><small>拖动画面旋转远景。第一人称准星为视野参考；“移动”用于检查走入效果时的粒子避让。这里只预览释放动画，实际弹道、钻地、灯域等跟随技能事件。</small></section></div></main>
<script>
const data=__GEOMETRY_DATA__;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),list=document.querySelector('.list');
let selected='24',first=false,paused=false,tick=0,lastTime=performance.now(),angle=.7,pitch=.38,drag=false,lx=0;
const buttons={};
for(const [id,d] of Object.entries(data)){const b=document.createElement('button');b.textContent=id+' · '+d.name;b.onclick=()=>{selected=id;tick=0;select()};list.append(b);buttons[id]=b;}
function select(){for(const [id,b] of Object.entries(buttons))b.classList.toggle('active',id===selected);document.querySelector('#name').textContent=selected+' · '+data[selected].name;}select();
document.querySelector('#orbit').onclick=()=>{first=false;mode()};document.querySelector('#first').onclick=()=>{first=true;mode()};function mode(){document.querySelector('#orbit').classList.toggle('active',!first);document.querySelector('#first').classList.toggle('active',first)}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};
canvas.onpointerdown=e=>{drag=true;lx=e.clientX;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(drag){angle+=(e.clientX-lx)*.012;lx=e.clientX}};
function project(x,y,z){if(first){const dz=z+Number(document.querySelector('#distance').value);if(dz<.15)return null;return [600+x/dz*650,375-(y-1.62)/dz*650,650/dz]}const u=x*Math.cos(angle)-z*Math.sin(angle),v=x*Math.sin(angle)+z*Math.cos(angle);return[600+u*39,500-y*39*Math.cos(pitch)+v*39*Math.sin(pitch),39]}
function line(a,b,color){a=project(...a);b=project(...b);if(!a||!b)return;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function point(x,y,z,color,alpha,size=1){const move=Number(document.querySelector('#distance').value);if(first&&Math.hypot(x,y,z+move)<4)return;const p=project(x,y,z);if(!p)return;ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(p[0],p[1],Math.max(.75,Math.min(6,p[2]*.035))*size,0,Math.PI*2);ctx.fill()}
function draw(now){if(!paused)tick=(tick+(now-lastTime)/50)%38;lastTime=now;const d=data[selected];ctx.clearRect(0,0,1200,750);ctx.globalAlpha=1;ctx.lineWidth=1;
for(let i=-12;i<=12;i++){line([i,0,-12],[i,0,12],'#192737');line([-12,0,i],[12,0,i],'#192737')}
if(!first){for(const x of[-.3,.3])line([x,0,0],[x,1.8,0],'#8497ad');line([-.3,1.8,0],[.3,1.8,0],'#8497ad');line([0,1.5,0],[0,1.5,1],'#557286')}
ctx.globalCompositeOperation='lighter';
for(let f=0;f<d.frames.length;f++){const age=tick-d.ticks[f];if(age<0||age>7)continue;const alpha=Math.max(0,1-age/8);for(const[x,y,z,t]of d.frames[f].points)point(x,y,z,t===2?'#f4faff':'#'+(t===0?d.a:d.b),alpha);if(age<4)for(const[x,y,z,dx,dy,dz,t]of d.frames[f].streaks){if(first&&Math.hypot(x,y,z+Number(document.querySelector('#distance').value))<6)continue;point(x+dx*age/4,y+dy*age/4,z+dz*age/4,t===2?'#f4faff':'#'+(t===0?d.a:d.b),1,2)}}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(first){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(592,375);ctx.lineTo(608,375);ctx.moveTo(600,367);ctx.lineTo(600,383);ctx.stroke()}
document.querySelector('#phase').textContent=tick<4?'蓄势':tick<9?'爆发':tick<19?'余光消散':'留白';const dist=Number(document.querySelector('#distance').value);document.querySelector('#position').textContent=dist===0?'站在施法点':'距施法点 '+dist.toFixed(1)+' 格';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
