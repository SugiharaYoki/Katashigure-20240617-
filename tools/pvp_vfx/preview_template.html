<!doctype html><meta charset="utf-8"><title>PVP 39 技能特效图谱</title><style>
*{box-sizing:border-box}body{background:#090b12;color:#edf0fc;font:15px system-ui;margin:36px}h1{font-size:28px}p{color:#a4aec6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:18px}.card{background:#111625;border:1px solid #283147;border-radius:14px;padding:16px}canvas{width:100%;height:225px}h2{font-size:16px;margin:6px}span{color:#70829e}button{background:#222d48;color:#fff;border:1px solid #425373;border-radius:8px;padding:8px 14px;cursor:pointer}</style><h1>PVP · 礼装特效图谱</h1><p>39 种技能的粒子几何与配色预览。拖动旋转，滚轮缩放。此图谱展示生成坐标，不是游戏截图；实际效果另含动画、音效及物品幻影。</p><button id="spin">暂停旋转</button><div class="grid"></div><script>const data=__GEOMETRY_DATA__;let angle=.4,pitch=.4,zoom=1,auto=true,down=false,last=0;document.querySelector('#spin').onclick=()=>auto=!auto;const cards=[];for(const [id,d] of Object.entries(data)){const el=document.createElement('div');el.className='card';el.innerHTML=`<h2><span>${id}</span> ${d.name}</h2><canvas width="550" height="450"></canvas>`;document.querySelector('.grid').appendChild(el);cards.push([el.querySelector('canvas'),d]);}document.addEventListener('pointerdown',e=>{if(e.target.tagName==='CANVAS'){down=true;last=e.clientX;}});document.addEventListener('pointerup',()=>down=false);document.addEventListener('pointermove',e=>{if(down){angle+=(e.clientX-last)*.012;last=e.clientX;}});document.addEventListener('wheel',e=>{if(e.target.tagName==='CANVAS'){zoom=Math.max(.4,Math.min(2.5,zoom-e.deltaY*.001));e.preventDefault();}},{passive:false});function draw(){if(auto&&!down)angle+=.003;for(const [c,d] of cards){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const max=Math.max(3,...d.points.map(p=>Math.max(Math.abs(p[0]),Math.abs(p[1]-1),Math.abs(p[2]))));const s=135/max*zoom;ctx.globalCompositeOperation='lighter';for(const [x,y,z,t] of d.points){const u=x*Math.cos(angle)-z*Math.sin(angle),v=x*Math.sin(angle)+z*Math.cos(angle);const yy=(y-1)*Math.cos(pitch)-v*Math.sin(pitch);ctx.fillStyle='#'+(t?d.b:d.a);ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(275+u*s,250-yy*s,1.7,0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';}requestAnimationFrame(draw);}draw();</script>
